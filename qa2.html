<!doctype html>
<html>
<head><meta charset="utf-8"><title>QA2</title>
<style>body{background:#2a3a2a;margin:0} canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1700" height="1700"></canvas>
<script type="module">
import { getEnemySprite } from "/src/game/render2d/EnemySprites.ts";
import { ENEMY_REGISTRY } from "/src/game/enemies/EnemyRegistry.ts";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
ctx.fillStyle = "#3a4a38";
ctx.fillRect(0,0,canvas.width,canvas.height);

const regulars = ENEMY_REGISTRY.filter(e => !e.isBoss);
const cell = 210;
let x = 10, y = 10, col=0;
for (const def of regulars) {
  const sprite = getEnemySprite(def, 0);
  ctx.fillStyle = "#1c261c";
  ctx.fillRect(x, y, cell-10, cell-10);
  ctx.drawImage(sprite, x+8, y+8, cell-40, cell-40);
  ctx.fillStyle = "#fff";
  ctx.font = "13px monospace";
  ctx.fillText(def.id, x+4, y+cell-16);
  col++;
  x += cell;
  if (col >= 5) { col = 0; x = 10; y += cell; }
}
window.__qaDone = true;
</script>
</body>
</html>
