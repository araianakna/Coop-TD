<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runeward VFX Gallery</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0a10;
        overflow: hidden;
        font-family: "Segoe UI", Roboto, sans-serif;
      }
      #app {
        position: absolute;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      #panel {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 14px 14px;
        background: linear-gradient(to top, rgba(6, 6, 10, 0.92), rgba(6, 6, 10, 0.55) 80%, transparent);
        color: #e8e6f0;
        font-size: 12px;
        z-index: 10;
      }
      #panel h1 {
        font-size: 13px;
        margin: 2px 0 8px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #b9aef0;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
        align-items: center;
      }
      .row .label {
        width: 84px;
        flex-shrink: 0;
        color: #8b8698;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 10px;
        letter-spacing: 0.05em;
      }
      button {
        background: #1b1826;
        border: 1px solid #3a3450;
        color: #e8e6f0;
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        background: #2a2440;
        border-color: #6a5ea8;
      }
      button.fire {
        border-color: #ff7a3c;
      }
      button.ice {
        border-color: #6fc3e8;
      }
      button.lightning {
        border-color: #8fb8ff;
      }
      button.nature {
        border-color: #6bd67c;
      }
      button.earth {
        border-color: #b8823f;
      }
      button.arcane {
        border-color: #c07af0;
      }
      button.fusion {
        border-color: #ffffff;
        font-weight: 700;
      }
      #hud {
        position: absolute;
        top: 10px;
        left: 14px;
        color: #cfc9e0;
        font-size: 11px;
        z-index: 10;
        background: rgba(6, 6, 10, 0.6);
        padding: 6px 10px;
        border-radius: 4px;
        max-width: 360px;
        line-height: 1.5;
      }
      #hud b {
        color: #fff;
      }
      label.toggle {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        color: #cfc9e0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <b>Runeward VFX Gallery</b><br />
      Pedestals = surface shader materials (rotating). Front row markers = impact/projectile
      spots. Center-back altar = fusion transform.<br />
      Drag right-mouse to orbit, wheel to zoom, WASD to pan.
    </div>
    <div id="panel"></div>
    <script type="module" src="/src/dev/vfx-gallery.ts"></script>
  </body>
</html>
