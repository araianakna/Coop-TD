    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0710;
        overflow: hidden;
        font-family: -apple-system, "Segoe UI", sans-serif;
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      .label {
        position: absolute;
        transform: translate(-50%, 0);
        color: #f4eaff;
        font-size: 12px;
        line-height: 1.3;
        text-align: center;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.7);
        pointer-events: none;
        white-space: nowrap;
      }
      #hud {
        position: absolute;
        top: 10px;
        left: 12px;
        color: #eae0ff;
        font-size: 13px;
        background: rgba(10, 6, 16, 0.6);
        padding: 8px 12px;
        border-radius: 6px;
        line-height: 1.5;
        pointer-events: none;
      }
      #hud b { color: #fff; }
