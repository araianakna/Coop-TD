<!doctype html>
<html>
<head><meta charset="utf-8"><title>QA</title>
<style>body{background:#2a3a2a;margin:0} canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1400" height="1400"></canvas>
<script type="module">
import { getEnemySprite } from "/src/game/render2d/EnemySprites.ts";
import { ENEMY_REGISTRY } from "/src/game/enemies/EnemyRegistry.ts";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
ctx.fillStyle = "#3a4a38";
ctx.fillRect(0,0,canvas.width,canvas.height);

const regulars = ENEMY_REGISTRY.filter(e => !e.isBoss);
const bosses = ENEMY_REGISTRY.filter(e => e.isBoss);

const cell = 130;
let x = 10, y = 10;
for (const def of regulars) {
  for (const frame of [0,1]) {
    const sprite = getEnemySprite(def, frame);
    ctx.fillStyle = "#243024";
    ctx.fillRect(x, y, cell-6, cell-6);
    ctx.drawImage(sprite, x+10, y+10, cell-26, cell-26);
    ctx.fillStyle = "#fff";
    ctx.font = "10px monospace";
    ctx.fillText(def.id + " f" + frame, x+4, y+cell-14);
    x += cell;
  }
  if (x > 1400 - cell) { x = 10; y += cell; }
}
y += cell;
x = 10;
for (const def of bosses) {
  for (const frame of [0,1]) {
    const sprite = getEnemySprite(def, frame);
    ctx.fillStyle = "#301c24";
    ctx.fillRect(x, y, cell*2-6, cell*2-6);
    ctx.drawImage(sprite, x+10, y+10, cell*2-26, cell*2-26);
    ctx.fillStyle = "#fff";
    ctx.font = "12px monospace";
    ctx.fillText(def.id + " f" + frame, x+4, y+cell*2-14);
    x += cell*2;
  }
}
window.__qaDone = true;
</script>
</body>
</html>
